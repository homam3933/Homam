<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMAM EXP - Link in Bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a00 0%, #2d1b00 50%, #1a0a00 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        
        .header .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #fff;
        }
        
        .header .url-info {
            text-align: center;
        }
        
        .header .url-info .lock-icon {
            font-size: 14px;
            color: #ccc;
        }
        
        .header .url-info .domain {
            font-size: 16px;
            font-weight: 600;
        }
        
        .header .url-info .platform {
            font-size: 12px;
            color: #aaa;
        }
        
        .header .actions {
            display: flex;
            gap: 15px;
        }
        
        .header .actions i {
            font-size: 22px;
            cursor: pointer;
        }
        
        /* Profile Section */
        .profile-section {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff9500;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(255, 149, 0, 0.3);
        }
        
        .heart-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #1a0a00;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .heart-btn:hover {
            transform: scale(1.1);
        }
        
        .heart-btn i {
            color: #fff;
            font-size: 18px;
        }
        
        .username {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        
        .verified-badge {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        /* Stats */
        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 149, 0, 0.2);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .stat-box .label {
            font-size: 12px;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .stat-box .value {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }
        
        /* Contact Buttons */
        .contact-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .contact-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 149, 0, 0.2);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .contact-btn:hover {
            background: rgba(255, 149, 0, 0.1);
            border-color: rgba(255, 149, 0, 0.4);
            transform: translateY(-2px);
        }
        
        .contact-btn i {
            font-size: 18px;
            color: #ff9500;
        }
        
        /* Bio Text */
        .bio-text {
            text-align: center;
            font-size: 18px;
            color: #ccc;
            margin-bottom: 25px;
            font-style: italic;
        }
        
        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .social-icon {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .social-icon:hover {
            background: rgba(255, 149, 0, 0.2);
            border-color: rgba(255, 149, 0, 0.4);
            transform: translateY(-3px);
        }
        
        /* YouTube Preview */
        .youtube-preview {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
        }
        
        .youtube-preview:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .youtube-preview i {
            font-size: 20px;
            color: #ff0000;
        }
        
        .youtube-preview span {
            font-size: 16px;
            font-weight: 600;
        }
        
        /* Share Button */
        .share-btn {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ff9500, #ff6b00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 149, 0, 0.4);
            transition: all 0.3s;
            z-index: 100;
        }
        
        .share-btn:hover {
            transform: scale(1.1) rotate(10deg);
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            z-index: 1000;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .toast.show {
            transform: translate(-50%, -50%) scale(1);
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-in {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }
        
        /* Responsive */
        @media (max-width: 400px) {
            .container {
                padding: 15px;
            }
            
            .username {
                font-size: 24px;
            }
            
            .stat-box .value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header animate-in delay-1">
            <div class="close-btn"><i class="fas fa-times"></i></div>
            <div class="url-info">
                <div><i class="fas fa-lock lock-icon"></i> <span class="domain">homamexp.bio</span></div>
                <div class="platform">Instagram</div>
            </div>
            <div class="actions">
                <i class="far fa-clock"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>
        
        <!-- Profile Section -->
        <div class="profile-section animate-in delay-2">
            <div class="avatar-container">
                <img src="https://ibb.co/ymTVn76k">
                <div class="heart-btn" onclick="toggleHeart(this)">
                    <i class="fas fa-heart"></i>
                </div>
            </div>
            <div class="username">
                HOMAM EXP
                <div class="verified-badge"><i class="fas fa-check"></i></div>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="stats-container animate-in delay-3">
            <div class="stat-box">
                <div class="label">Followers</div>
                <div class="value" id="followersCount">--</div>
            </div>
            <div class="stat-box">
                <div class="label">Likes</div>
                <div class="value">--</div>
            </div>
        </div>
        
        <!-- Contact Buttons -->
        <div class="contact-buttons animate-in delay-3">
            <a href="mailto:homamyt3933@gmail.com" class="contact-btn">
                <i class="fas fa-envelope"></i>
                <span>Email</span>
            </a>
            <a href="https://www.instagram.com/homam_exp?igsh=MTdkeGtpNWVnc3ViZA==" class="contact-btn" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>Contact Me</span>
            </a>
        </div>
        
        <!-- Bio -->
        <div class="bio-text animate-in delay-4">
            صناع محتوى | مرتحل 🌍
        </div>
        
        <!-- Social Icons -->
        <div class="social-icons animate-in delay-5">
            <a href="https://www.instagram.com/homam_exp?igsh=MTdkeGtpNWVnc3ViZA==" class="social-icon" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/18Y7J3DAvF/" class="social-icon" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.youtube.com/channel/UCHhBiPLUeNDr5r17J69j7mA" class="social-icon" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
        
        <!-- YouTube Preview -->
        <a href="https://www.youtube.com/channel/UCHhBiPLUeNDr5r17J69j7mA" class="youtube-preview animate-in delay-6" target="_blank">
            <i class="fab fa-youtube"></i>
            <span>YouTube Channel</span>
        </a>
    </div>
    
    <!-- Share Button -->
    <button class="share-btn" onclick="sharePage()">
        <i class="fas fa-share-alt"></i>
    </button>
    
    <!-- Toast -->
    <div class="toast" id="toast">تم النسخ!</div>
    
    <script>
        // Toggle Heart
        function toggleHeart(btn) {
            btn.style.transform = 'scale(1.3)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 200);
        }
        
        // Share Page
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'HOMAM EXP - Link in Bio',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast('تم نسخ الرابط!');
                });
            }
        }
        
        // Show Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
        
        // Fetch Instagram Followers
        async function fetchFollowers() {
            try {
                const response = await fetch('https://socialcounts.org/api/instagram-live-follower-count/homam_exp');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.followers) {
                        document.getElementById('followersCount').textContent = formatNumber(data.followers);
                    }
                }
            } catch (error) {
                document.getElementById('followersCount').textContent = '1.2K';
            }
        }
        
        // Format number
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchFollowers();
        });
    </script>
</body>
</html>
